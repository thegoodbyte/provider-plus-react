name: Admin contracts
on:
  pull_request:
  push:
    branches: [production]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run test:contracts
      - run: npm test -- --watch=false --runInBand src/services/contracts.test.ts
      - name: Check paired API repository when configured
        if: vars.CONTRACTS_API_REPOSITORY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTRACTS_API_REPOSITORY }}
          ref: ${{ vars.CONTRACTS_API_REF || 'production' }}
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: paired-api
      - name: Compare API and admin versions
        if: vars.CONTRACTS_API_REPOSITORY != ''
        run: npm run check:contracts -- --api paired-api
